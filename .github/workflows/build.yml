name: Build

on: [push]

permissions:
  # To allow creating releases and attaching artifacts to it.
  contents: write

jobs:
  linux-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update and install packages
        run: |
          sudo apt-get update
          sudo apt-get install fonts-firacode fonts-linuxlibertine poppler-utils zip
          sudo snap install typst
      - name: Convert sheets
        run: |
          make
          for lang in fr en
          do
            pushd build/${lang}/ 
            zip python-sheets-${lang}.zip */*.pdf
            popd
          done
      - name: Check PDF files
        run: |
          if file build/*/*/*.pdf | grep -v " [12] page"
          then
            echo "Some PDFs have more than 2 pages!"
            exit 1
          fi
      - name: Merged versions
        run: |
          for lang in fr en
          do
            pushd build/$lang
            pdfunite */*.pdf python-sheets-${lang}.pdf
            popd
          done
      # Ensure tag is updated, so that the date shown on the release is recent.
      - uses: richardsimko/update-tag@v3
        with:
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish zips and pdfs
        uses: softprops/action-gh-release@v3
        with:
          name: latest
          tag_name: latest
          body: Latest version of the sheets / Dernière version des fiches
          files: |
            build/en/python-sheets-en.zip
            build/fr/python-sheets-fr.zip
            build/en/python-sheets-en.pdf
            build/fr/python-sheets-fr.pdf
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
